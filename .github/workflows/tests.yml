name: Tests
on: [push, pull_request]
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run regression and integration tests
        run: python -m unittest discover -v
      - name: Check package installation
        run: python -m pip install .
      - name: Smoke-test installed entry points
        run: |
          yuyi-emotion --help
          yuyi-self --help
